<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cypress</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="text-center">
            <img src="https://cdn-icons-png.flaticon.com/128/3105/3105256.png" width="80" class="logo">
            <h3><strong>Cypress</strong></h3>
            <p class="text-muted">Secure Access Portal</p>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <img src="https://cdn-icons-png.flaticon.com/128/6784/6784655.png" width="80" class="logo">
                <div class="text-center">
                    <p class="text-muted">Your account has been verified.</p>
                    <p class="text-muted">Proceed to login</p>
                </div>
            </div>
        </div>
    </div>

    <script src="verification.js"></script>

    <script src="index.js"></script>

</html>
