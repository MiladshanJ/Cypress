<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
    <link href="view-reports.css" rel="stylesheet"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="topnav">
        <div class="logo"><strong>Submitted Reports</strong></div>
        <div class="nav-links">
            <a href="map.html"><strong>Home</strong></a>
            <a class="active"><strong>View Reports</strong></a>
        </div>
    </div>

    <div class="container mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <label>Sort by:</label>
                <select id="sortSelect" class="form-select">
                    <option value="">Select</option>
                    <option value="date">Date</option>
                    <option value="urgency">Urgency</option>
                    <option value="status">Status</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Filter by Issue Type:</label>
                <select id="issueTypeSelect" class="form-select">
                    <option value="">All Types</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Filter by Sub-Issue:</label>
                <select id="subIssueSelect" class="form-select">
                    <option value="">All Sub-Issues</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Keyword Search:</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Enter keyword...">
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="container">
        <div id="reportsContainer"></div>
    </div>

    <script src="view-reports.js"></script>
</body>
</html>
