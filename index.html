<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cypress</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #e3f2fd, #f8f9fa);
            font-family: 'Segoe UI', sans-serif;
        }

        .auth-wrapper {
            max-width: 420px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            border-radius: 15px;
        }

        .logo {
            display: block;
            margin: 0 auto 15px;
        }

        .tab-content {
            padding-top: 20px;
        }

        .btn-dark {
            background-color: #343a40;
            border: none;
        }

        .btn-dark:hover {
            background-color: #23272b;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="text-center">
            <img src="https://cdn-icons-png.flaticon.com/128/3105/3105256.png" width="80" class="logo">
            <h3><strong>Cypress</strong></h3>
            <p class="text-muted">Secure Access Portal</p>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <!-- Nav tabs -->
                <ul class="nav nav-tabs nav-fill mb-3" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Register</button>
                    </li>
                </ul>

                <!-- Tab panes -->
                <div class="tab-content">
                    <!-- Login Tab -->
                    <div class="tab-pane fade show active" id="login" role="tabpanel">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="login-username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password">
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-dark" onclick="login()">Login</button>
                        </div>
                    </div>

                    <!-- Register Tab -->
                    <div class="tab-pane fade" id="register" role="tabpanel">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="reg-username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="reg-email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="reg-password">
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-dark" onclick="register()">Register</button>
                        </div>
                    </div>
                </div>

                <div id="message" class="text-danger"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
