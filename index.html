<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cypress</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="text-center">
            <img src="https://cdn-icons-png.flaticon.com/128/3105/3105256.png" width="80" class="logo">
            <h3><strong>Cypress</strong></h3>
            <p class="text-muted">Secure Access Portal</p>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <ul class="nav nav-tabs nav-fill mb-3" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Register</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="login" role="tabpanel">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="login-username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password">
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-dark" onclick="login()">Login</button>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="register" role="tabpanel">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="reg-username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="reg-email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="reg-password">
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-dark" onclick="register()">Register</button>
                        </div>
                    </div>
                </div>

                <div id="message" class="text-danger"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
