<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UFT-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-DQvkBjpPgn7RC31MCQoOeC9TI2kdqa4+BSgNMNj8v77fdC77Kj5zpWFTJaaAoMbC" crossorigin="anonymous">
    
    <h1><b>Cypress</b></h1>
    <style>
        textarea { resize: none; }

        body {
            font-family: 'Trebuchet MS';
        }

        h1 {
            color: white;  
            background-color: rgb(22, 87, 136); 
            padding: 20px;
            text-align: left;
        }

        #map {
            height: 80vh; 
            width: 95%; 
            margin: 10px auto 10px;
            display: block;
        }

        .form-container {
            width: 95%;
            margin: 20px auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
            box-shadow: 1px 1px 1px rgb(185, 184, 184);
        }

        #successMessage {
            width: 95%;
            margin: auto;
            font-size: large;
        }


    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.min.js" integrity="sha384-Re460s1NeyAhufAM5JwfIGWosokaQ7CH15ti6W5Y4wC/m4eJ5opJ2ivohxVM05Wd" crossorigin="anonymous"></script>
    
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div id="successMessage" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                    ✅ Your report has been successfully submitted.
                    <br>
                    Confirmation email sent
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div id="map"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <form class="form-container">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="location" class="d-block mb-1">Location</label>
                            <input type="text" id="location" name="location" class="form-control" readonly>
                        </div>
                        <div class="col-md-3 offset-md-1">
                            <label for="time" class="d-block mb-1">Time</label>
                            <input type="text" id="time" name="time" class="form-control" readonly>
                            
                        </div>
                        <div class="col-md-3 offset-md-1">
                            <label for="problem" class="d-block mb-1">Topic</label>
                            <select id="issue" name="problem" class="form-control" required>
                                <option value="">Select an Issue</option>
                                <option value="Pothole">Pothole</option>
                                <option value="Something1">????</option>
                                <option value="SOmehting2">??????</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="4" style="height: 150px"></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="reset" class="btn btn-danger">Cancel</button>
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="map.js"></script>
</body>
</html>
